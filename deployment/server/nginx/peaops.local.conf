# Local pilot demo only (not production). Serves the same stack over plain HTTP
# on 127.0.0.1:8080 so browsers without the self-signed CA can use it.
server {
  listen 80;
  listen [::]:80;
  server_name _;
  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location /metrics { proxy_pass http://api:8000; proxy_set_header Host $host; }
  location /docs { proxy_pass http://api:8000; }
  location /openapi.json { proxy_pass http://api:8000; }
  location / { proxy_pass http://web:80; proxy_set_header Host $host; }
}