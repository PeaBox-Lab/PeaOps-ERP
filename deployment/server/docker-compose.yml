
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: peaops
      POSTGRES_USER: peaops
      POSTGRES_PASSWORD: change-me
    volumes: [peaops_db:/var/lib/postgresql/data]
  api:
    build: ../../backend
    environment:
      PEAOPS_DATABASE_URL: postgresql+psycopg://peaops:change-me@db:5432/peaops
      PEAOPS_SECRET_KEY: change-me
    ports: ["8000:8000"]
    depends_on: [db]
volumes:
  peaops_db:
