
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-peaops}
      POSTGRES_USER: ${POSTGRES_USER:-peaops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - peaops_db:/var/lib/postgresql/data
      - ./backups:/backups
      - ./scripts:/opt/peaops/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-peaops} -d ${POSTGRES_DB:-peaops}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]
  migrate:
    build: ../../backend
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    environment: &api_env
      PEAOPS_ENVIRONMENT: production
      PEAOPS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-peaops}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-peaops}
      PEAOPS_SECRET_KEY: ${PEAOPS_SECRET_KEY:?set PEAOPS_SECRET_KEY}
      PEAOPS_ALLOWED_ORIGINS: ${PEAOPS_ALLOWED_ORIGINS:?set PEAOPS_ALLOWED_ORIGINS}
      PEAOPS_AUTO_CREATE_SCHEMA: "false"
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]
  api:
    build: ../../backend
    restart: unless-stopped
    environment: *api_env
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [backend]
  web:
    build: ../../frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [backend]
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/peaops.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks: [backend]
networks:
  backend:
    driver: bridge
volumes:
  peaops_db:
