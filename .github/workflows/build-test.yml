name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: peaops
          POSTGRES_USER: peaops
          POSTGRES_PASSWORD: peaops
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
      - name: Run tests
        working-directory: backend
        env:
          PEAOPS_DATABASE_URL: postgresql+psycopg://peaops:peaops@localhost:5432/peaops
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Build
        run: cd frontend && npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Start production stack
        run: docker compose -f deployment/server/docker-compose.production.yml -f deployment/server/docker-compose.local.yml up -d
      - name: Wait for health proxy
        run: |
          for i in $(seq 1 60); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/health/ready || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          curl -f http://localhost:8080/api/v1/health/ready
      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Install and install browsers
        run: cd frontend && npm ci && npx playwright install --with-deps chromium
      - name: Run Playwright smoke tests
        run: cd frontend && npx playwright test
        env:
          E2E_BASE_URL: http://localhost:8080